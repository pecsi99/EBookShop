<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>E-Books List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@4.3.1/dist/solar/bootstrap.min.css">
</head>
<body>
<div style="position: fixed; top: 10px; left: 10px; z-index: 1000;">
    <a th:href="@{/}" title="Vissza a főoldalra">
        <img src="https://img.icons8.com/ios-filled/50/ffffff/home.png" alt="Főoldal" style="width: 30px; height: 30px;">

    </a>
</div>

<div class="container mt-5">
    <div th:if="${param.added}" class="alert alert-success" role="alert">
        Könyv hozzáadva a kosárhoz! ✅
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Available E-Books</h2>

        <!-- Dropdown menü rendezéshez -->
        <div class="dropdown">
            <button class="btn btn-secondary dropdown-toggle" type="button" id="sortMenuButton" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                Rendezés
            </button>
            <div class="dropdown-menu dropdown-menu-right" aria-labelledby="sortMenuButton">
                <a class="dropdown-item" th:href="@{/products/list(sort='priceDesc')}">Ár (csökkenő)</a>
                <a class="dropdown-item" th:href="@{/products/list(sort='priceAsc')}">Ár (növekvő)</a>
                <a class="dropdown-item" th:href="@{/products/list(sort='pagesDesc')}">Oldalak száma (csökkenő)</a>

            </div>

        </div>
    </div>

    <!-- Könyvlista -->
    <table class="table table-bordered table-hover table-dark">
        <thead>
        <tr>
            <th>ID</th>
            <th>Cím</th>
            <th>Szerző</th>
            <th>Oldalak</th>
            <th>Ár</th>
            <th>Műfaj</th>
            <th>Művelet</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="book : ${products}">
            <td th:text="${book.id}"></td>
            <td th:text="${book.title}"></td>
            <td th:text="${book.author}"></td>
            <td th:text="${book.pages}"></td>
            <td th:text="${book.price}"></td>
            <td th:text="${book.genre}"></td>
            <td>
                <form th:action="@{/cart/add}" method="post">
                    <input type="hidden" name="productId" th:value="${book.id}" />
                    <button type="submit" class="btn btn-sm btn-primary">Add to Cart</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <a class="btn btn-primary btn-lg" th:href="@{/cart/cartlist}" role="button">View Cart</a>
</div>

<!-- Bootstrap JS és jQuery -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.bundle.min.js"></script>
<script>
    setTimeout(function() {
        var alert = document.querySelector('.alert');
        if (alert) {
            alert.style.transition = 'opacity 0.5s ease-out';
            alert.style.opacity = '0';
            setTimeout(() => alert.remove(), 500); // teljes eltávolítás fél másodperc múlva
        }
    }, 1000);
</script>

</body>
</html>
